<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>직장생활 빌런 월드컵</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#171b24; --panel2:#202633; --text:#f7f8fb; --muted:#9aa4b5;
    --accent:#ff4d6d; --accent2:#ffb703; --line:#2d3443; --good:#50fa7b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    background:radial-gradient(circle at top,#252c3d 0,#11141c 42%,#090b10 100%);
    color:var(--text);min-height:100vh;
  }
  .wrap{width:min(1180px,94vw);margin:0 auto;padding:28px 0 56px}
  header{text-align:center;margin-bottom:22px}
  .badge{display:inline-flex;gap:8px;align-items:center;background:#24151a;border:1px solid #5e2633;
    color:#ff8ca1;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800}
  h1{font-size:clamp(30px,5vw,58px);margin:12px 0 6px;letter-spacing:-.04em}
  .sub{color:var(--muted);font-size:clamp(14px,2vw,18px);line-height:1.6}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:rgba(23,27,36,.9);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
    position:sticky;top:10px;z-index:20;backdrop-filter:blur(10px);margin-bottom:18px
  }
  .round{font-size:20px;font-weight:900}
  .progress{flex:1;min-width:200px;height:10px;background:#0e1117;border-radius:999px;overflow:hidden;border:1px solid #30394a}
  .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.35s}
  button{font:inherit}
  .btn{
    border:0;border-radius:12px;background:#2a3141;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.12)}
  .match{
    display:grid;grid-template-columns:1fr 88px 1fr;gap:18px;align-items:stretch;margin-top:18px;
  }
  .vs{
    align-self:center;justify-self:center;width:72px;height:72px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(135deg,#ff335f,#ff9f1c);
    font-size:28px;font-weight:1000;box-shadow:0 12px 40px #ff335f44;border:5px solid #11141c
  }
  .card{
    border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#202636,#141821);
    overflow:hidden;cursor:pointer;position:relative;transition:.2s transform,.2s box-shadow,.2s border-color;
    min-height:520px;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-5px);border-color:#697690;box-shadow:0 18px 60px #0008}
  .card:active{transform:scale(.99)}
  .imgbox{position:relative;aspect-ratio:16/10;background:#0f1218;overflow:hidden}
  .imgbox img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
  .card:hover img{transform:scale(1.025)}
  .villain-label{
    position:absolute;left:14px;top:14px;right:14px;padding:10px 12px;border-radius:13px;
    background:rgba(5,7,10,.82);backdrop-filter:blur(7px);font-weight:1000;font-size:clamp(17px,2vw,23px);
    border:1px solid #ffffff22;text-shadow:0 2px 8px #000;
  }
  .rank{position:absolute;right:14px;bottom:14px;background:#ff335f;color:#fff;font-weight:1000;
    padding:7px 10px;border-radius:999px;font-size:12px}
  .content{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .title{font-size:clamp(23px,3vw,33px);font-weight:1000;line-height:1.15;letter-spacing:-.035em}
  .desc{color:#c6cedb;line-height:1.58;font-size:15px;flex:1}
  .hint{color:#ff9cad;font-weight:900;font-size:13px}
  .champion{
    display:none;text-align:center;background:linear-gradient(180deg,#251a12,#151821);
    border:1px solid #76501c;border-radius:28px;padding:24px;overflow:hidden
  }
  .champion.show{display:block}
  .champion img{width:min(680px,100%);aspect-ratio:16/10;object-fit:cover;border-radius:20px;border:1px solid #ffffff22}
  .crown{font-size:64px}
  .champion h2{font-size:clamp(32px,5vw,54px);margin:4px 0 8px}
  .pool{margin-top:30px;background:#131720;border:1px solid var(--line);border-radius:22px;padding:20px}
  .pool summary{cursor:pointer;font-weight:900;font-size:18px}
  .poolgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
  .pill{padding:9px 10px;border-radius:10px;background:#1d2330;color:#c9d1df;font-size:13px}
  .footer{margin-top:24px;text-align:center;color:#727d90;font-size:12px;line-height:1.7}
  @media(max-width:820px){
    .match{grid-template-columns:1fr;gap:12px}
    .vs{width:54px;height:54px;font-size:21px;z-index:3;margin:-16px auto}
    .card{min-height:0}
    .poolgrid{grid-template-columns:repeat(2,1fr)}
    .topbar{top:6px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">🔥 공감주의 · 퇴사욕구 유발주의</div>
    <h1>직장생활 빌런 월드컵</h1>
    <div class="sub">100명의 직장 빌런 후보 중 무작위 32명이 출전합니다.<br>더 빌런력이 높은 쪽을 클릭해 최강 빌런을 뽑아보세요.</div>
  </header>

  <div class="topbar">
    <div class="round" id="roundText">32강</div>
    <div class="progress"><div id="progressBar"></div></div>
    <button class="btn" id="restartBtn">🔄 새 32강 뽑기</button>
  </div>

  <main>
    <section class="match" id="match">
      <article class="card" id="leftCard"></article>
      <div class="vs">VS</div>
      <article class="card" id="rightCard"></article>
    </section>

    <section class="champion" id="champion">
      <div class="crown">👑</div>
      <div style="color:#ffcf66;font-weight:900">최종 우승 · 직장 최강 빌런</div>
      <h2 id="championName"></h2>
      <p id="championDesc" style="color:#c8d0dc"></p>
      <img id="championImg" alt="우승 빌런 이미지">
      <div style="margin-top:16px"><button class="btn" onclick="startGame()">다시 하기</button></div>
    </section>

    <details class="pool">
      <summary>후보 100종 전체 보기</summary>
      <div class="poolgrid" id="poolGrid"></div>
    </details>
  </main>

  <div class="footer">
    이미지 로딩 실패 시 자동으로 대체 이미지가 표시됩니다. 외부 이미지 서비스의 정책에 따라 사진이 변경될 수 있습니다.<br>
    이 콘텐츠는 특정 개인을 지칭하지 않는 가상의 직장생활 밈/게임용 유형입니다.
  </div>
</div>

<script>
const names = [
"회의 때 말 없다가 끝나면 딴소리 빌런","퇴근 5분 전 업무투척 빌런","읽씹 후 '못 봤어요' 빌런","내 공을 자기 공으로 포장 빌런",
"책임은 팀원, 성과는 본인 빌런","말 끊고 자기 얘기만 하는 빌런","모든 메일에 전체답장 빌런","CC 폭탄 빌런",
"메신저로 '안녕하세요'만 보내고 잠수 빌런","급하지 않은데 매번 '긴급' 빌런","점심 메뉴 30분 고민 빌런","법카 메뉴 독재 빌런",
"남의 간식 슬쩍 빌런","냉장고 음식 무단흡입 빌런","전자레인지 생선 빌런","향수 과다분사 빌런",
"키보드 타격음 콘서트 빌런","스피커폰 통화 빌런","이어폰 없이 영상 재생 빌런","사무실 온도 독재 빌런",
"창문 열기·닫기 무한전쟁 빌런","기침하면서 마스크 안 쓰는 빌런","감기인데 출근투혼 빌런","커피 심부름 고정배정 빌런",
"복사기 종이 없으면 도망 빌런","프린터 오류 남기고 튀는 빌런","회의실 예약만 하고 안 오는 빌런","회의실 시간 초과 점거 빌런",
"회의 5분 전에 자료달라 빌런","회의자료 안 읽고 질문폭탄 빌런","이미 정한 답으로 회의하는 빌런","회의를 위한 회의 빌런",
"30분 회의를 2시간 만드는 빌런","아젠다 없는 회의 소집 빌런","퇴근 후 단톡 업무지시 빌런","주말 아침 카톡 빌런",
"휴가자에게 연락하는 빌런","연차 사유 캐묻는 빌런","연차 전날 업무폭탄 빌런","휴가 다녀오면 산더미 빌런",
"칼퇴 눈치주는 빌런","야근을 충성심으로 보는 빌런","일찍 와서 늦게 가기만 하는 빌런","자리 비움 감시 빌런",
"화장실 시간 체크 빌런","점심시간 업무회의 빌런","점심 끝 1분 전 업무콜 빌런","출근시간 1분 지각 공개저격 빌런",
"본인은 지각하면서 남은 잡는 빌런","맨날 '라떼는' 빌런","신입에게 잡일 몰빵 빌런","후배 아이디어 무시 후 재활용 빌런",
"직급으로 의견 누르는 빌런","반말 자동장착 빌런","기분 따라 업무 기준 바뀌는 빌런","어제 A, 오늘 B 지시 빌런",
"지시를 애매하게 하고 결과만 혼내는 빌런","수정 37차 빌런","최종_진짜최종_최최종 빌런","문서 양식 1픽셀 집착 빌런",
"오탈자 하나로 내용 전체 폄하 빌런","PPT 폰트 경찰 빌런","엑셀 색깔로 업무평가 빌런","데이터보다 느낌 빌런",
"근거 없이 '그냥 해봐' 빌런","일단 반대부터 하는 빌런","대안 없이 비판만 하는 빌런","'원래 다 그래' 체념전파 빌런",
"안 되는 이유 전문가 빌런","남 탓 자동화 빌런","실수 숨기기 빌런","문제 생기면 잠수 빌런",
"전화 대신 옆자리 사람에게 전달 빌런","메신저 1초 답장 압박 빌런","점 세 개 입력중 공포 빌런","음성메시지 5분 빌런",
"메일 제목 '문의' 빌런","첨부파일 빠뜨리고 재전송 빌런","파일명을 '새 폴더(2)'로 주는 빌런","공용폴더 정리 파괴 빌런",
"버전관리 무시 빌런","비밀번호를 단톡에 올리는 빌런","보안수칙 귀찮다고 우회 빌런","PC 잠금 안 하는 빌런",
"회사 소문 확성기 빌런","뒷담화 중계 빌런","누가 누구랑 친한지 정치질 빌런","상사 앞에서만 열일 빌런",
"회의 때 상사 농담에 과잉웃음 빌런","회식 2차 강요 빌런","술잔 비면 자동충전 빌런","회식 장기자랑 빌런",
"사생활 질문폭격 빌런","결혼·연애 잔소리 빌런","외모평가 빌런","연봉 탐문 빌런",
"퇴사자 앞에서 배신자 드립 빌런","신입 이름 계속 틀리는 빌런","인사해도 안 받는 빌런","아는 척 전문가 빌런"
];

const descBits = [
"조용히 있다가 결정 끝난 뒤 판을 다시 엎는 타입.",
"퇴근 버튼을 누르는 순간 갑자기 생각난 업무를 던지는 타입.",
"확인했지만 확인하지 않은 척하는 선택적 기억력의 소유자.",
"팀플레이의 결과를 개인 하이라이트 영상으로 편집하는 타입.",
"사소한 습관 하나로 주변의 업무 집중력을 서서히 깎아먹는 타입.",
"회의의 목적보다 회의 자체를 더 사랑하는 타입.",
"업무 기준이 날씨처럼 매일 바뀌는 타입.",
"공용 공간을 자기 방처럼 사용하는 타입.",
"메신저 알림만으로 동료의 심박수를 올리는 타입.",
"직급·분위기·눈치를 활용해 남의 에너지를 흡수하는 타입."
];

// 외부에서 바로 불러올 수 있는 사무실/업무 이미지 서비스.
// lock 값이 달라 후보마다 다른 사진이 표시되도록 구성.
function imgUrl(i){
  return `https://loremflickr.com/900/560/office,coworker,meeting?lock=${1000+i}`;
}
function fallback(i){
  return `https://picsum.photos/seed/workvillain${i}/900/560`;
}
const villains = names.map((name,i)=>({
  id:i+1,
  name,
  desc: descBits[i % descBits.length],
  img: imgUrl(i+1),
  fallback: fallback(i+1)
}));

let current=[], nextRound=[], pairIndex=0, initialCount=32, totalChoices=31, madeChoices=0;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function roundName(n){
  if(n===2) return "결승";
  if(n===4) return "4강";
  return `${n}강`;
}
function cardHTML(v, side){
  return `
    <div class="imgbox">
      <img src="${v.img}" alt="${v.name}" onerror="this.onerror=null;this.src='${v.fallback}'">
      <div class="villain-label">${v.name}</div>
      <div class="rank">후보 #${String(v.id).padStart(3,"0")}</div>
    </div>
    <div class="content">
      <div class="title">${v.name}</div>
      <div class="desc">${v.desc}</div>
      <div class="hint">☝️ 더 빌런 같다면 이 카드를 클릭!</div>
    </div>`;
}
function render(){
  document.getElementById("champion").classList.remove("show");
  document.getElementById("match").style.display="grid";

  if(current.length===1){
    showChampion(current[0]); return;
  }
  const left=current[pairIndex];
  const right=current[pairIndex+1];
  document.getElementById("roundText").textContent =
    `${roundName(current.length)} · ${Math.floor(pairIndex/2)+1}/${current.length/2} 매치`;
  document.getElementById("leftCard").innerHTML=cardHTML(left,"L");
  document.getElementById("rightCard").innerHTML=cardHTML(right,"R");
  document.getElementById("progressBar").style.width=`${(madeChoices/totalChoices)*100}%`;
}
function choose(v){
  nextRound.push(v);
  madeChoices++;
  pairIndex+=2;
  if(pairIndex>=current.length){
    current=[...nextRound];
    nextRound=[];
    pairIndex=0;
  }
  if(current.length===1) showChampion(current[0]);
  else render();
}
function showChampion(v){
  document.getElementById("match").style.display="none";
  const c=document.getElementById("champion");
  c.classList.add("show");
  document.getElementById("roundText").textContent="🏆 우승자 탄생";
  document.getElementById("progressBar").style.width="100%";
  document.getElementById("championName").textContent=v.name;
  document.getElementById("championDesc").textContent=v.desc;
  const im=document.getElementById("championImg");
  im.src=v.img; im.onerror=()=>{im.onerror=null;im.src=v.fallback};
}
function startGame(){
  current=shuffle(villains).slice(0,32);
  nextRound=[];pairIndex=0;madeChoices=0;
  render();
}
document.getElementById("leftCard").addEventListener("click",()=>choose(current[pairIndex]));
document.getElementById("rightCard").addEventListener("click",()=>choose(current[pairIndex+1]));
document.getElementById("restartBtn").addEventListener("click",startGame);
document.addEventListener("keydown",(e)=>{
  if(document.getElementById("match").style.display==="none") return;
  if(e.key==="ArrowLeft") choose(current[pairIndex]);
  if(e.key==="ArrowRight") choose(current[pairIndex+1]);
});
document.getElementById("poolGrid").innerHTML=villains.map(v=>`<div class="pill">${v.id}. ${v.name}</div>`).join("");
startGame();
</script>
</body>
</html>
